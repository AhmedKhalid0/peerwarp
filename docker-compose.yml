version: "3.8"

services:
  signaling-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: peerwarp-signaling
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  web-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: peerwarp-client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SIGNALING_URL=ws://localhost:8000/ws
    depends_on:
      - signaling-server
    restart: unless-stopped
